<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Usuário</title>
    <style>
        body{font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;background:#f5f7fb;padding:24px}
        .card{max-width:600px;margin:0 auto;background:#fff;padding:24px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,0.06)}
        label{display:block;margin-bottom:6px;font-weight:600}
        input,select{width:100%;padding:10px;border-radius:6px;border:1px solid #e6e6e6;margin-bottom:12px}
        .actions{display:flex;gap:10px;justify-content:flex-end}
        .btn{padding:8px 12px;border-radius:8px;border:none;cursor:pointer}
        .btn-primary{background:linear-gradient(90deg,#667eea,#764ba2);color:#fff}
    </style>
</head>
<body>
    <div class="card">
        <h2>Novo Usuário</h2>

        {% if erro %}
            <div style="background:#fff0f0;padding:10px;border-radius:6px;margin:10px 0;color:#c33">{{ erro }}</div>
        {% endif %}

        <form action="/usuarios/novo" method="post">
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" value="{{ nome or '' }}" required>

            <label for="email">Email</label>
            <input type="email" name="email" id="email" value="{{ email or '' }}" required>

            <label for="role">Função</label>
            <select name="role" id="role">
                <option value="operador" {% if role == 'operador' %}selected{% endif %}>Operador</option>
                <option value="admin" {% if role == 'admin' %}selected{% endif %}>Administrador</option>
            </select>

            <div class="actions">
                <a href="/usuarios" class="btn">Cancelar</a>
                <button class="btn btn-primary" type="submit">Criar</button>
            </div>
        </form>
    </div>
</body>
</html>
